name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
      - master # phong khi repo dung nhanh mac dinh la master
  workflow_dispatch: # cho phep bam chay tay tren tab Actions

permissions:
  contents: write

# Push lien tiep thi huy build cu, tranh 2 lan deploy de len nhau
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # can cho .GitInfo / lastmod cua theme

      - name: Clean stale public/ directory
        run: rm -rf public

      - name: Verify theme exists
        run: |
          if [ ! -f themes/hugo-theme-learn/theme.toml ]; then
            echo "::error::Thieu themes/hugo-theme-learn tren GitHub -> site se build ra trang trang."
            echo "Chay tren may: git add -f themes/ && git commit -m 'add theme' && git push"
            exit 1
          fi

      # Tu tinh baseURL dung theo repo -> khong bao gio bi vo CSS vi quen sua config.toml
      - name: Compute base URL
        id: baseurl
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "$OWNER_LC.github.io" ]; then
            URL="https://$OWNER_LC.github.io/"
          else
            URL="https://$OWNER_LC.github.io/$REPO/"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Base URL se dung: $URL"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.134.3"
          extended: true

      - name: Build website
        run: hugo --minify --gc --baseURL "${{ steps.baseurl.outputs.url }}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

      - name: Print site URL
        run: echo "::notice title=Link bao cao::${{ steps.baseurl.outputs.url }}"

  build-pdf:
    runs-on: ubuntu-latest
    # needs: build-deploy
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install TeX Live and pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-other \
            latexmk \
            pandoc

      - name: Verify LaTeX packages
        run: |
          echo "=== Checking key packages ==="
          for pkg in vntex mathptmx fancyhdr mdframed pdfpages float listings; do
            if kpsewhich ${pkg}.sty > /dev/null 2>&1; then
              echo "  $pkg: found"
            else
              echo "  $pkg: NOT FOUND"
            fi
          done

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Convert Hugo content to LaTeX
        run: python3 scripts/convert_hugo_to_latex.py

      - name: Compile Vietnamese PDF
        working-directory: report
        run: |
          latexmk -pdf -interaction=nonstopmode main.tex
          latexmk -pdf -interaction=nonstopmode main.tex
          latexmk -pdf -interaction=nonstopmode main.tex
          cp main.pdf ../report_vn.pdf

      - name: Compile English PDF
        working-directory: report
        run: |
          latexmk -pdf -interaction=nonstopmode main_en.tex
          latexmk -pdf -interaction=nonstopmode main_en.tex
          latexmk -pdf -interaction=nonstopmode main_en.tex
          cp main_en.pdf ../report_en.pdf
      
      - name: Package LaTeX source
        run: |
          zip -r latex_source.zip report scripts content config.toml \
            -x "report/*.aux" \
            -x "report/*.log" \
            -x "report/*.out" \
            -x "report/*.toc" \
            -x "report/*.fls" \
            -x "report/*.fdb_latexmk" \
            -x "report/*.pdf"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest Internship Reports"
          body: |
            ## Internship Report PDFs

            Automated PDF generation from Hugo content on push to `main`.

            - **Vietnamese**: `report_vn.pdf`
            - **English**: `report_en.pdf`
            - **LaTeX source**: `latex_source.zip`
          artifacts: "report_vn.pdf,report_en.pdf,latex_source.zip"
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
